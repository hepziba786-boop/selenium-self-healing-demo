name: Selenium Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - run: mvn -B clean test

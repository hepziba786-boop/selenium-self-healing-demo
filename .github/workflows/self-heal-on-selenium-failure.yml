name: Self-Heal Selenium Failure

on:
  workflow_run:
    workflows: ["Selenium Tests"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  open-self-heal-request:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Open self-heal issue and notify PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const pr = run.pull_requests && run.pull_requests.length > 0 ? run.pull_requests[0] : null;
            const actor = run.triggering_actor?.login || run.actor?.login || 'repo-maintainers';
            const branch = run.head_branch || 'unknown-branch';
            const sha = run.head_sha || '';
            const shortSha = sha ? sha.slice(0, 7) : 'unknown';
            const issueTitle = `Self-heal Selenium failure: ${branch} @ ${shortSha}`;
            const runUrl = run.html_url || `https://github.com/${owner}/${repo}/actions/runs/${run.id}`;
            const failureSummary = `The \`${run.name}\` workflow failed after a UI-related change.`;
            const prUrl = pr?.number ? `https://github.com/${owner}/${repo}/pull/${pr.number}` : null;

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: 'self-heal-selenium',
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'self-heal-selenium',
                  color: 'B60205',
                  description: 'Requests Selenium self-healing investigation after CI failures.',
                });
              }
            }

            async function appHtmlChanged() {
              if (pr?.number) {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });

                return files.some((file) => file.filename === 'app/index.html');
              }

              const commit = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha,
              });

              return (commit.data.files || []).some((file) => file.filename === 'app/index.html');
            }

            if (!(await appHtmlChanged())) {
              core.notice('Skipping self-heal request because app/index.html was not part of the failing change.');
              return;
            }

            await ensureLabel();

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'self-heal-selenium',
              per_page: 100,
            });

            const existingIssue = openIssues.find((issue) => issue.title === issueTitle);

            const issueBody = [
              '## Selenium self-heal trigger',
              '',
              `${failureSummary}`,
              '',
              `- Workflow run: ${runUrl}`,
              `- Branch: \`${branch}\``,
              `- Head SHA: \`${sha}\``,
              prUrl ? `- Pull request: ${prUrl}` : null,
              `- Requested by: @${actor}`,
              '',
              '### Intelligent Regression Testing Agent instructions',
              '',
              'Follow `.github/copilot-instructions.md` exactly.',
              'Use the linked failed workflow run as the primary CI context.',
              'Record every test row with explicit **PASSED ✅** / **FAILED ❌** status before and after the fix.',
              'If this repository is private/internal and a Copilot automation is configured for issues labeled `self-heal-selenium`, use this issue as the trigger payload to diagnose the failure, open the repair PR, and reply with the full before/after flow table.',
              'If the repository is public, treat this issue as the notification hand-off for a maintainer to invoke the agent manually because Copilot automations are not available for public repositories.',
            ].filter(Boolean).join('\n');

            let issueNumber;

            if (existingIssue) {
              issueNumber = existingIssue.number;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `A new failing workflow run was detected for \`${branch}\` at \`${shortSha}\`.\n\nRun: ${runUrl}`,
              });
            } else {
              const createdIssue = await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                labels: ['self-heal-selenium'],
              });

              issueNumber = createdIssue.data.number;
            }

            if (pr?.number) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  `@${actor} Selenium tests failed after an \`app/index.html\` change.`,
                  '',
                  `I opened #${issueNumber} to track a self-heal request.`,
                  '',
                  'If Copilot automations are enabled for this repository, that issue can trigger the Intelligent Regression Testing Agent automatically.',
                  `Failed run: ${runUrl}`,
                ].join('\n'),
              });
            }
